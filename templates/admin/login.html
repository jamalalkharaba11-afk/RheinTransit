<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<div class="login"><div class="login-logo">Rhein<span>Umzug</span></div><h1>Admin Login</h1><form method="post"><label>Benutzername<input name="username" required></label><label>Passwort<input name="password" type="password" required></label><button class="cta submit">Einloggen</button></form>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}</div></body></html>
